<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{
    padding:25px 15px;
    position:relative;
    background: url('siyah-altin-logo.png') no-repeat center center;
    background-size: contain;
    background-color:#0b0b0b;
}
.sub{
    font-size:18px;
    font-weight:bold;
    margin:6px 0;
    text-shadow:0 0 6px #000;
}
.header-main-title{
    font-size:38px;
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 15px #ffd700;
    max-width:90%;
    margin-left:auto;
    margin-right:auto;
}
.header-sub-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 8px #ffd700;
}
.professional-title{
    font-size:32px;
    font-weight:800;
    margin-bottom:15px;
    color:#ffd700;
    text-shadow:0 0 12px #ffd700,0 0 22px #ffd700;
}
.sk-title{
    font-size:32px;
    font-weight:500;
    color:#ffd700;
    text-shadow:0 0 4px #ffd700, 0 0 8px #ffd700;
    margin:10px auto 15px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}
.language-switch{
    position:absolute;
    top:15px;
    right:20px;
    font-weight:bold;
    font-size:14px;
}
.language-switch span{
    cursor:pointer;
    margin:0 5px;
    text-decoration:underline;
}
.language-switch span:hover{ color:#ffd700; }
</style>
</head>

<body>

<header>
    <div class="language-switch">
        <span onclick="setLanguage('tr')">TR</span> | 
        <span onclick="setLanguage('en')">EN</span>
    </div>

    <h1 class="header-main-title">
        <span style="text-transform:capitalize;">Siyah Altın </span><span style="text-transform:uppercase;">P</span>rodüksiyon
    </h1>
    <div class="sk-title">S K</div>
    <h2 class="header-sub-title">BLACK GOLD PRODUCTION</h2>
    <div class="professional-title">PROFESYONEL</div>

    <div class="sub">Hazır Şarkılar • Besteler</div>
    <div class="sub">Satışa ve Devire Hazır Eserler</div>
    <div class="sub">Özel talepler doğrultusunda özgün çalışmalar hazırlanır.</div>
</header>

</body>
</html>
