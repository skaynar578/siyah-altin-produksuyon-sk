<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{margin:0;font-family:Arial;background:#0b0b0b;color:#d4af37;text-align:center}
.category{margin:20px auto;max-width:420px;border:1px solid #d4af37;padding:12px;border-radius:12px}
.category h3{cursor:pointer;display:flex;gap:6px}
.track-list{display:none;margin-top:10px}
.track-list div{padding:6px;cursor:pointer;border-bottom:1px solid #333}
.track-list div:hover{background:#1a1a1a}
.player-box{border:1px solid #d4af37;padding:20px;border-radius:14px}
</style>
</head>

<body>

<div class="player-box">
<div id="nowPlaying">Seçili şarkı yok</div>
<audio id="audioPlayer" controls controlslist="nodownload"></audio>
</div>

<!-- YENİ NESİL ARABESK -->
<div class="category">
<h3 onclick="toggleList('arabesk')">🎧 Yeni Nesil Arabesk</h3>
<div class="track-list" id="arabesk">
<div onclick="playTrack('Küllerimden Kalktım','kullerimden-kalktim.mp3')">
🎧 Küllerimden Kalktım
</div>
</div>
</div>

<!-- ARABESK POP -->
<div class="category">
<h3 onclick="toggleList('arabeskpop')">🎧 Arabesk Pop Karışımı</h3>
<div class="track-list" id="arabeskpop">
<div onclick="playTrack('Dünya Benim Olurdu','dunya-benim-olurdu.mp3')">
🎧 Dünya Benim Olurdu
</div>
</div>
</div>

<!-- TÜRKÜ -->
<div class="category">
<h3 onclick="toggleList('turku')">🎧 Türkü</h3>
<div class="track-list" id="turku">
<div onclick="playTrack('Bu Da Geçer','buda-gecer-turku.mp3')">
🎧 Bu Da Geçer
</div>
</div>
</div>

<script>
const player=document.getElementById("audioPlayer")
const nowPlaying=document.getElementById("nowPlaying")

function playTrack(name,file){
player.src=file
nowPlaying.innerText="Çalan: "+name
player.play()
}

function toggleList(id){
const el=document.getElementById(id)
el.style.display = el.style.display==="block" ? "none" : "block"
}
</script>

</body>
</html>
