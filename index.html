<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
/* === STYLE AYNEN KORUNDU === */
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{ font-size:18px; font-weight:bold; margin:6px 0; }
.header-main-title{
    font-size:38px; font-weight:900; letter-spacing:8px;
    margin-bottom:5px; color:#ffd700;
    text-shadow:0 0 15px #ffd700;
}
.header-sub-title{
    font-size:28px; font-weight:700;
    color:#ffd700; text-shadow:0 0 8px #ffd700;
}
.professional-title{
    font-size:32px; font-weight:800;
    color:#ffd700; text-shadow:0 0 12px #ffd700;
}
.player-box{ border:1px solid #d4af37; padding:20px; border-radius:14px; }
.category{
    margin:20px auto; max-width:420px;
    border:1px solid #d4af37; padding:12px; border-radius:12px;
}
.category h3{ cursor:pointer; display:flex; gap:6px; }
.track-list{ display:none; margin-top:10px; }
.track-list div{
    padding:6px; cursor:pointer;
    border-bottom:1px solid #333;
}
.track-list div:hover{ background:#1a1a1a; }
</style>
</head>

<body>

<section>

<div class="category">
    <h3 onclick="toggleList('arabeskpop')">🎧 Arabesk Pop Karışımı</h3>
    <div class="track-list" id="arabeskpop">

        <div onclick="playTrack('Dünya Benim Olurdu','dunya-benim-olurdu.mp3.mp3')">
            <span>🎧</span> Dünya Benim Olurdu
        </div>

        <!-- ✅ YENİ EKLENEN ALT YAPI -->
        <div onclick="playTrack('Küllerim Yanıyor','kullerim-yaniyor-altyapi.mp3')">
            <span>🎧</span> Küllerim Yanıyor (Alt Yapı)
        </div>

    </div>
</div>

</section>

<script>
const player=document.getElementById("audioPlayer") || new Audio();
function playTrack(name,file){
    player.src=file;
    player.play();
}
function toggleList(id){
    const el=document.getElementById(id);
    el.style.display=el.style.display==="block"?"none":"block";
}
</script>

</body>
</html>
