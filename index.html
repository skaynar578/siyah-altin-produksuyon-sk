<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{ font-size:18px; font-weight:bold; margin:6px 0; }

.header-main-title{
    font-size:38px;
    font-weight:900;
    letter-spacing:8px;
    color:#ffd700;
    text-shadow:0 0 15px #ffd700;
}

.professional-title{
    font-size:32px;
    font-weight:800;
    color:#ffd700;
    text-shadow:0 0 12px #ffd700;
}

.player-box-container{ max-width:450px; margin:50px auto 20px; }
.player-box{
    border:1px solid #d4af37;
    padding:20px;
    border-radius:14px;
}
.player-box.playing{ box-shadow:0 0 40px #ffd700; }

.category{
    margin:20px auto;
    max-width:420px;
    border:1px solid #d4af37;
    padding:12px;
    border-radius:12px;
}

.category h3{
    cursor:pointer;
    margin:0;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:bold;
}

.track-list{
    display:none;
    margin-top:10px;
}

.track-list div{
    padding:6px;
    cursor:pointer;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    gap:6px;
}

.track-list div:hover{
    background:#1a1a1a;
}

.icon-shake{ animation:shake 0.6s; }

@keyframes shake{
    0%{transform:rotate(0)}
    25%{transform:rotate(8deg)}
    50%{transform:rotate(-8deg)}
    75%{transform:rotate(8deg)}
    100%{transform:rotate(0)}
}
</style>
</head>

<body>

<header>
    <h1 class="header-main-title">SİYAH ALTIN PRODÜKSİYON</h1>
    <div class="professional-title">PROFESYONEL</div>
    <div class="sub">Hazır Şarkılar • Besteler</div>
</header>

<section>

<div class="player-box-container">
    <div class="player-box" id="playerBox">
        <div id="nowPlaying">Seçili şarkı yok</div>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<!-- ✅ YENİLER (TEK VE DOĞRU) -->
<div class="category">
    <h3 onclick="toggleList('yeniler')">
        <span class="icon-shake">🎧</span> Yeniler Mix
    </h3>
    <div class="track-list" id="yeniler">

        <div onclick="playTrack('Yeniler Mix','1.mp3.mp3')">
            <span>🎧</span> Yeniler Mix
        </div>

        <div onclick="playTrack('Gözlerin','gozlerin.mp3.mp3')">
            <span>🎧</span> Gözlerin
        </div>

    </div>
</div>

<!-- ARABESK -->
<div class="category">
    <h3 onclick="toggleList('arabesk')">
        <span class="icon-shake">🎧</span> Yeni Nesil Arabesk
    </h3>
    <div class="track-list" id="arabesk">
        <div onclick="playTrack('Küllerimden Kalktım','kullerimden-kalktim.mp3.mp3')">
            <span>🎧</span> Küllerimden Kalktım
        </div>
    </div>
</div>

<!-- ARABESK POP -->
<div class="category">
    <h3 onclick="toggleList('arabeskpop')">
        <span class="icon-shake">🎧</span> Arabesk Pop Karışımı
    </h3>
    <div class="track-list" id="arabeskpop">
        <div onclick="playTrack('Dünya Benim Olurdu','dunya-benim-olurdu.mp3.mp3')">
            <span>🎧</span> Dünya Benim Olurdu
        </div>
    </div>
</div>

</section>

<script>
const player = document.getElementById("audioPlayer");
const nowPlaying = document.getElementById("nowPlaying");
const playerBox = document.getElementById("playerBox");

function playTrack(name,file){
    if(player.src.includes(file)){
        player.paused ? player.play() : player.pause();
    }else{
        player.src = file;
        nowPlaying.textContent = "Çalan Şarkı: " + name;
        player.play();
    }
    player.paused
        ? playerBox.classList.remove("playing")
        : playerBox.classList.add("playing");
}

function toggleList(id){
    const el = document.getElementById(id);
    el.style.display = el.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
