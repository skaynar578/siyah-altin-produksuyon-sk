<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
/* --- CSS AYNEN --- */
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{ font-size:18px; font-weight:bold; margin:6px 0; }
.header-main-title{
    font-size:38px;
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 15px #ffd700;
}
.header-sub-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:5px;
    color:#ffd700;
}
.professional-title{
    font-size:32px;
    font-weight:800;
    margin-bottom:15px;
    color:#ffd700;
}
.category{
    margin:20px auto;
    max-width:420px;
    border:1px solid #d4af37;
    padding:12px;
    border-radius:12px;
}
.category h3{
    cursor:pointer;
    margin:0;
    display:flex;
    align-items:center;
    gap:6px;
}
.track-list{ display:none; margin-top:10px; }
.track-list div{
    padding:6px;
    cursor:pointer;
    border-bottom:1px solid #333;
    display:flex;
    gap:6px;
}
.icon-shake{ display:inline-block; }
</style>
</head>

<body>

<section>

<div class="category">
    <h3 onclick="toggleList('pop')"><span class="icon-shake">🎧</span> Pop</h3>
    <div class="track-list" id="pop">
        <div onclick="playTrack('Korkuyorum','mp3.korkuyorum.mp3')">🎧 Korkuyorum</div>

        <!-- SADECE BU SATIR DEĞİŞTİ -->
        <div onclick="playTrack('Masal','masal-pop-mp3.mp3')">🎧 Masal</div>

        <div onclick="playTrack('Bu Geçer','bu-gecer.mp3.mp3')">🎧 Bu Geçer</div>
        <div onclick="playTrack('Buhadi Gidelim','buhadi-gidelim-pop.mp3')">🎧 Buhadi Gidelim</div>
    </div>
</div>

</section>

<script>
const player=new Audio();

function playTrack(name,file){
    player.src=file;
    player.play();
}
function toggleList(id){
    const el=document.getElementById(id);
    el.style.display=el.style.display==="block"?"none":"block";
}
</script>

</body>
</html>
