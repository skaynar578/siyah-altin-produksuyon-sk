<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{
    font-size:18px;
    font-weight:bold;
    margin:6px 0;
}
.header-main-title{
    font-size:38px;
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 15px #ffd700;
    max-width:90%;
    margin-left:auto;
    margin-right:auto;
}
.header-sub-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 8px #ffd700;
}
.professional-title{
    font-size:32px;
    font-weight:800;
    margin-bottom:15px;
    color:#ffd700;
    text-shadow:0 0 12px #ffd700,0 0 22px #ffd700;
}
.sk-title{
    font-size:32px; 
    font-weight:500;
    color:#ffd700;
    text-shadow:0 0 4px #ffd700, 0 0 8px #ffd700; 
    margin:10px auto 15px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px; 
}
.sk-s, .sk-k{ display:inline-block; }
.language-switch{
    position:absolute;
    top:15px;
    right:20px;
    font-weight:bold;
    font-size:14px;
}
.language-switch span{
    cursor:pointer;
    margin:0 5px;
    text-decoration:underline;
}
.language-switch span:hover{ color:#ffd700; }
.player-box-container{
    max-width:450px;
    margin:50px auto 20px auto;
}
.player-description{
    font-weight:bold;
    font-size:16px;
    color:#ffd700;
    text-transform:uppercase;
    text-shadow:0 0 8px #ffd700;
    margin-bottom:10px;
}
.player-box{
    border:1px solid #d4af37;
    padding:20px;
    border-radius:14px;
    box-shadow:0 0 20px rgba(212,175,55,0.3);
    transition:0.3s, box-shadow 0.5s;
}
.player-box.playing{ animation:playerGlow 1s infinite alternate; }
#nowPlaying{ font-weight:bold; margin-bottom:10px; transition:0.3s; }
audio{ width:100%; height:32px; }
.category{
    margin:20px auto;
    max-width:420px;
    border:1px solid #d4af37;
    padding:12px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(212,175,55,0.1);
    transition:0.3s;
}
.category:hover{ box-shadow:0 0 25px rgba(212,175,55,0.25); }
.category h3{
    cursor:pointer;
    margin:0;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:bold;
}
.track-list{
    display:none;
    margin-top:10px;
    animation:fadeInList 0.4s ease-in-out;
}
.track-list div{
    padding:6px;
    cursor:pointer;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    gap:6px;
}
.track-list div:hover{
    background:#1a1a1a;
    transform:translateX(3px);
    transition:0.3s;
}
@keyframes fadeInList{
    from{opacity:0; transform:translateY(-10px);}
    to{opacity:1; transform:translateY(0);}
}
@keyframes playerGlow{
    0%{box-shadow:0 0 20px rgba(212,175,55,0.5);}
    50%{box-shadow:0 0 35px rgba(212,175,55,0.8);}
    100%{box-shadow:0 0 50px rgba(212,175,55,1);}
}
.icon-shake{ display:inline-block; }
</style>
</head>

<body>

<header>
    <h1 class="header-main-title">Siyah Altın Prodüksiyon</h1>
</header>

<section>
    <div class="player-box-container">
        <div class="player-description">SATIŞA VE DEVİRE HAZIR ESERLERİ DİNLEYEBİLİRSİNİZ</div>
        <div class="player-box" id="playerBox">
            <div id="nowPlaying">Seçili şarkı yok</div>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <div class="category">
        <h3 onclick="toggleList('slowpop')"><span class="icon-shake">🎧</span> Slow Pop</h3>
        <div class="track-list" id="slowpop">
            <div onclick="playTrack('Kırık Düşler – Slow Pop','kirik-dusler.mp3.mp3')">
                <span>🎧</span> Kırık Düşler – Slow Pop
            </div>

            <div onclick="playTrack('İz Kalır Benden – Tanıtım','iz-kalır-benden.tanitim.mp3')">
                <span>🎧</span> İz Kalır Benden – Tanıtım
            </div>
        </div>
    </div>
</section>

<script>
const player=document.getElementById("audioPlayer");
const nowPlaying=document.getElementById("nowPlaying");
const playerBox=document.getElementById("playerBox");

function playTrack(name,file){
    if(player.src.includes(file)){
        player.paused?player.play():player.pause();
    }else{
        player.src=file;
        nowPlaying.textContent="Çalan Şarkı: "+name;
        player.play();
    }
    player.paused?playerBox.classList.remove("playing"):playerBox.classList.add("playing");
}

function toggleList(id){
    const el=document.getElementById(id);
    el.style.display=el.style.display==="block"?"none":"block";
}
</script>

</body>
</html>
