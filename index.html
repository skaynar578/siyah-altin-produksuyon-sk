<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{
    font-size:18px;
    font-weight:bold;
    margin:6px 0;
}

/* DEĞİŞMEDİ */
.header-main-title{
    font-size:38px;
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 15px #ffd700;
    max-width:90%;
    margin-left:auto;
    margin-right:auto;
}

/* ⬇ MATLAŞTIRILDI */
.header-sub-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:5px;
    color:#e6c85a;
    text-shadow:0 0 3px rgba(255,215,0,0.4);
}

/* ⬇ MATLAŞTIRILDI */
.professional-title{
    font-size:32px;
    font-weight:800;
    margin-bottom:15px;
    color:#e0c35a;
    text-shadow:0 0 4px rgba(255,215,0,0.35);
}

/* ⬇ MATLAŞTIRILDI (S K) */
.sk-title{
    font-size:48px;
    font-weight:500;
    color:#e6c85a;
    text-shadow:0 0 3px rgba(255,215,0,0.35);
    margin:10px auto 15px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.sk-line{
    width:20px;
    border-bottom:2px solid rgba(255,215,0,0.6);
}

.language-switch{
    position:absolute;
    top:15px;
    right:20px;
    font-weight:bold;
    font-size:14px;
}
.language-switch span{
    cursor:pointer;
    margin:0 5px;
    text-decoration:underline;
}

.player-description{
    font-weight:bold;
    font-size:16px;
    color:#ffd700;
    text-shadow:0 0 8px #ffd700;
    margin-bottom:10px;
}

/* GERİ KALAN HER ŞEY AYNEN */
</style>
</head>

<body>

<header>
    <h1 class="header-main-title">Siyah Altın Prodüksiyon</h1>

    <div class="sk-title">
        <span>S</span><span class="sk-line"></span><span>K</span>
    </div>

    <h2 class="header-sub-title">BLACK GOLD PRODUCTION</h2>
    <div class="professional-title">PROFESYONEL</div>

    <div class="sub">Hazır Şarkılar • Besteler</div>
    <div class="sub">Satışa ve Devire Hazır Eserler</div>
</header>

</body>
</html>
