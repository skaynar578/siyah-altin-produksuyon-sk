<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{
    font-size:18px;
    font-weight:bold;
    margin:6px 0;
}
.header-main-title{
    font-size:38px;
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow:0 0 15px #ffd700; /* AYNI */
    max-width:90%;
    margin-left:auto;
    margin-right:auto;
}
.header-sub-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow:0 0 3px #ffd700; /* DÜŞÜRÜLDÜ */
}
.professional-title{
    font-size:32px;
    font-weight:800;
    margin-bottom:15px;
    color:#ffd700;
    text-shadow:0 0 4px #ffd700; /* DÜŞÜRÜLDÜ */
}
.sk-title{
    font-size:48px;
    font-weight:500;
    color:#ffd700;
    text-shadow:0 0 3px #ffd700; /* DÜŞÜRÜLDÜ */
    margin:10px auto 15px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}
.sk-s,.sk-k{display:inline-block;}
.sk-line{
    display:inline-block;
    width:20px;
    border-bottom:3px solid #ffd700;
}
.language-switch{
    position:absolute;
    top:15px;
    right:20px;
    font-weight:bold;
    font-size:14px;
}
.language-switch span{
    cursor:pointer;
    margin:0 5px;
    text-decoration:underline;
}
.language-switch span:hover{color:#ffd700;}

.player-box-container{
    max-width:450px;
    margin:50px auto 20px auto;
}
.player-description{
    font-weight:bold;
    font-size:16px;
    color:#ffd700;
    text-transform:uppercase;
    text-shadow:0 0 8px #ffd700;
    margin-bottom:10px;
}
.player-box{
    border:1px solid #d4af37;
    padding:20px;
    border-radius:14px;
    box-shadow:0 0 20px rgba(212,175,55,0.3);
    transition:0.3s, box-shadow 0.5s;
}
.player-box.playing{
    animation:playerGlow 1s infinite alternate;
}
#nowPlaying{font-weight:bold;margin-bottom:10px;}
audio{width:100%;height:32px;}

.category{
    margin:20px auto;
    max-width:420px;
    border:1px solid #d4af37;
    padding:12px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(212,175,55,0.1);
}
.category:hover{box-shadow:0 0 25px rgba(212,175,55,0.25);}
.category h3{
    cursor:pointer;
    margin:0;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:bold;
}
.track-list{display:none;margin-top:10px;}
.track-list div{
    padding:6px;
    cursor:pointer;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    gap:6px;
}
.track-list div:hover{
    background:#1a1a1a;
    transform:translateX(3px);
}

footer{
    padding:25px 15px;
    font-size:14px;
    max-width:900px;
    margin:30px auto 0 auto;
    text-align:left;
}
footer .description{font-size:13px;color:#f0e68c;}
footer .contacts{font-weight:bold;font-size:16px;}
footer .contacts span.year{font-weight:900;color:#ffd700;margin-left:8px;}

.fixed-buttons{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.fixed-buttons a{
    text-decoration:none;
    padding:10px 14px;
    border-radius:6px;
    font-weight:bold;
    font-size:14px;
    color:#0b0b0b;
}
.whatsapp-btn{background:#25D366;}
.message-btn{background:#d4af37;}

@keyframes playerGlow{
    0%{box-shadow:0 0 20px rgba(212,175,55,0.5);}
    100%{box-shadow:0 0 50px rgba(212,175,55,1);}
}
</style>
</head>

<body>

<header>
<div class="language-switch">
    <span onclick="setLanguage('tr')">TR</span> | 
    <span onclick="setLanguage('en')">EN</span>
</div>

<h1 class="header-main-title">
    <span style="text-transform:capitalize;">Siyah Altın </span><span style="text-transform:uppercase;">P</span>rodüksiyon
</h1>

<div class="sk-title">
    <span class="sk-s">S</span>
    <span class="sk-line"></span>
    <span class="sk-k">K</span>
</div>

<h2 class="header-sub-title" id="header-sub-title">BLACK GOLD PRODUCTION</h2>
<div class="professional-title">PROFESYONEL</div>

<div class="sub" id="sub1">Hazır Şarkılar • Besteler</div>
<div class="sub" id="sub2">Satışa ve Devire Hazır Eserler</div>
</header>

<section>
<div class="player-box-container">
    <div class="player-description" id="playerDesc">SATIŞA VE DEVİRE HAZIR ESERLERİ DİNLEYEBİLİRSİNİZ</div>
    <div class="player-box" id="playerBox">
        <div id="nowPlaying">Seçili şarkı yok</div>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>
</section>

<script>
function setLanguage(){}
</script>

</body>
</html>
