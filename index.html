<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
/* --- STYLE AYNI, DEĞİŞTİRİLMEDİ --- */
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{ font-size:18px; font-weight:bold; margin:6px 0; }
.header-main-title{
    font-size:38px; font-weight:900; letter-spacing:8px;
    margin-bottom:5px; color:#ffd700;
    text-shadow:0 0 15px #ffd700;
}
.header-sub-title{ font-size:28px; font-weight:700; color:#ffd700; }
.professional-title{ font-size:32px; font-weight:800; color:#ffd700; }
.category{
    margin:20px auto;
    max-width:420px;
    border:1px solid #d4af37;
    padding:12px;
    border-radius:12px;
}
.category h3{ cursor:pointer; display:flex; gap:6px; }
.track-list{ display:none; margin-top:10px; }
.track-list div{ cursor:pointer; padding:6px; }
.icon-shake{ display:inline-block; }
</style>
</head>

<body>

<section>
    <!-- KATEGORİLER -->

    <div class="category">
        <h3 onclick="toggleList('yeniler')"><span class="icon-shake">🎧</span> Yeniler Mix</h3>
        <div class="track-list" id="yeniler">
            <div onclick="playTrack('Yeniler Mix','yeniler.mp3')">🎧 Yeniler Mix</div>
        </div>
    </div>

    <div class="category">
        <h3 onclick="toggleList('arabesk')"><span class="icon-shake">🎧</span> Yeni Nesil Arabesk</h3>
        <div class="track-list" id="arabesk">
            <div onclick="playTrack('Küllerimden Kalktım – Arabesk','kullerimden-kalktim.mp3')">🎧 Küllerimden Kalktım</div>
        </div>
    </div>

    <div class="category">
        <h3 onclick="toggleList('pop')"><span class="icon-shake">🎧</span> Pop</h3>
        <div class="track-list" id="pop">
            <div onclick="playTrack('Korkuyorum','korkuyorum.mp3')">🎧 Korkuyorum</div>
        </div>
    </div>

    <div class="category">
        <h3 onclick="toggleList('slowpop')"><span class="icon-shake">🎧</span> Slow Pop</h3>
        <div class="track-list" id="slowpop">
            <div onclick="playTrack('Kırık Düşler','kirik-dusler.mp3')">🎧 Kırık Düşler</div>
        </div>
    </div>

    <!-- 🔽 EKLENEN TEK KATEGORİ 🔽 -->
    <div class="category">
        <h3 onclick="toggleList('hiphop')"><span class="icon-shake">🎧</span> Yeni Nesil Hip Hop</h3>
        <div class="track-list" id="hiphop">
            <div onclick="playTrack('Yeni Nesil Hip Hop','yeninesil-hiphop.mp3')">🎧 Yeni Nesil Hip Hop</div>
        </div>
    </div>

</section>

<script>
function toggleList(id){
    const el=document.getElementById(id);
    el.style.display=el.style.display==="block"?"none":"block";
}
function playTrack(name,file){
    console.log(name,file);
}
</script>

</body>
</html>
