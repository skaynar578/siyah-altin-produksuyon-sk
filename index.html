<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{ font-size:18px; font-weight:bold; margin:6px 0; }
.player-box{ border:1px solid #d4af37; padding:20px; border-radius:14px; }
.category{
    margin:20px auto;
    max-width:420px;
    border:1px solid #d4af37;
    padding:12px;
    border-radius:12px;
}
.category h3{
    cursor:pointer;
    margin:0;
    display:flex;
    align-items:center;
    gap:6px;
}
.track-list{
    display:none;
    margin-top:10px;
}
.track-list div{
    padding:6px;
    cursor:pointer;
    border-bottom:1px solid #333;
}
.track-list div:hover{
    background:#1a1a1a;
}
</style>
</head>

<body>

<section>

<!-- PLAYER -->
<div class="player-box">
    <div id="nowPlaying">Seçili şarkı yok</div>
    <audio id="audioPlayer" controls></audio>
</div>

<!-- ARABESK -->
<div class="category">
    <h3 onclick="toggleList('arabesk')">🎧 Arabesk</h3>
    <div class="track-list" id="arabesk">

        <div onclick="playTrack('Küllerimden Kalktım','kullerimden-kalktim.mp3.mp3')">
            <span>🎧</span> Küllerimden Kalktım
        </div>

        <!-- ✅ YENİ EKLENEN ŞARKI -->
        <div onclick="playTrack('Gözlerin','gozlerin.mp3')">
            <span>🎧</span> Gözlerin
        </div>

    </div>
</div>

</section>

<script>
const player=document.getElementById("audioPlayer");
const nowPlaying=document.getElementById("nowPlaying");

function playTrack(name,file){
    player.src=file;
    nowPlaying.textContent="Çalan Şarkı: "+name;
    player.play();
}

function toggleList(id){
    const el=document.getElementById(id);
    el.style.display=el.style.display==="block"?"none":"block";
}
</script>

</body>
</html>
