<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{ font-size:18px; font-weight:bold; margin:6px 0; }
.header-main-title{
    font-size:38px; font-weight:900; letter-spacing:8px;
    color:#ffd700; text-shadow:0 0 15px #ffd700;
}
.header-sub-title{ font-size:28px; font-weight:700; color:#ffd700; }
.professional-title{ font-size:32px; font-weight:800; color:#ffd700; }
.sk-title{ font-size:32px; display:flex; justify-content:center; gap:6px; }
.language-switch{ position:absolute; top:15px; right:20px; }
.player-box-container{ max-width:450px; margin:40px auto; }
.player-box{ border:1px solid #d4af37; padding:20px; border-radius:14px; }
.category{
    margin:20px auto; max-width:420px;
    border:1px solid #d4af37; padding:12px; border-radius:12px;
}
.category h3{ cursor:pointer; display:flex; gap:6px; }
.track-list{ display:none; margin-top:10px; }
.track-list div{ padding:6px; cursor:pointer; display:flex; gap:6px; }
.track-list div:hover{ background:#1a1a1a; }
.icon-shake{ display:inline-block; }
</style>
</head>

<body>

<header>
    <h1 class="header-main-title">Siyah Altın Müzik Prodüksiyon</h1>
    <div class="sk-title"><span>S</span><span>K</span></div>
    <h2 class="header-sub-title">BLACK GOLD PRODUCTION</h2>
    <div class="professional-title">PROFESYONEL</div>
    <div class="sub">Hazır Şarkılar • Besteler</div>
</header>

<section>

<div class="player-box-container">
    <div class="player-box" id="playerBox">
        <div id="nowPlaying">Seçili şarkı yok</div>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<!-- POP -->
<div class="category">
<h3 onclick="toggleList('pop')">🎧 Pop</h3>
<div class="track-list" id="pop">
    <div onclick="playTrack('Aşkın Rüyası – Pop Mix','askin-rüyasi-pop-mix.mp3.mp3')">🎧 Aşkın Rüyası – Pop Mix</div>
    <div onclick="playTrack('Korkuyorum','mp3.korkuyorum.mp3')">🎧 Korkuyorum</div>
    <div onclick="playTrack('Masal','masal-pop-mp3.mp3')">🎧 Masal</div>
    <div onclick="playTrack('Bu Geçer','bu-gecer.mp3.mp3')">🎧 Bu Geçer</div>
    <div onclick="playTrack('Hadi Gidelim','hadi-gidelim-pop.mp3')">🎧 Hadi Gidelim</div>
</div>
</div>

<!-- SLOW POP -->
<div class="category">
<h3 onclick="toggleList('slowpop')">🎧 Slow Pop</h3>
<div class="track-list" id="slowpop">
    <div onclick="playTrack('İz Kalır Benden','iz-kalir-benden.mp3')">🎧 İz Kalır Benden</div>
</div>
</div>

<!-- HIP HOP -->
<div class="category">
<h3 onclick="toggleList('hiphop')">🎧 Yeni Nesil Hip Hop</h3>
<div class="track-list" id="hiphop">
    <div onclick="playTrack('Yangın Gibi – Hip Hop','yangin-gibi-hip-hop.tanıtım.mp3')">🎧 Yangın Gibi – Hip Hop</div>
</div>
</div>

</section>

<script>
const player=document.getElementById("audioPlayer");
const nowPlaying=document.getElementById("nowPlaying");
function playTrack(name,file){
    player.src=file;
    nowPlaying.textContent="Çalan: "+name;
    player.play();
}
function toggleList(id){
    const el=document.getElementById(id);
    el.style.display=el.style.display==="block"?"none":"block";
}
</script>

</body>
</html>
