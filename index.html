<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{
    font-size:18px;
    font-weight:bold;
    margin:6px 0;
}
.header-main-title{
    font-size:38px;
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 15px #ffd700;
    max-width:90%;
    margin-left:auto;
    margin-right:auto;
}
.header-sub-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 8px #ffd700;
}

/* 🔽 SADECE BURASI YUMUŞATILDI */
.professional-title{
    font-size:32px;
    font-weight:800;
    margin-bottom:15px;
    color:#ffd700;
    text-shadow:0 0 6px rgba(255,215,0,0.6),
               0 0 12px rgba(255,215,0,0.4);
}

.sk-title{
    font-size:48px;
    font-weight:500;
    color:#ffd700;
    text-shadow:0 0 6px #ffd700, 0 0 12px #ffd700;
    margin:10px auto 15px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}
.sk-line{
    width:20px;
    border-bottom:3px solid #ffd700;
}
.language-switch{
    position:absolute;
    top:15px;
    right:20px;
    font-weight:bold;
    font-size:14px;
}
.language-switch span{
    cursor:pointer;
    margin:0 5px;
    text-decoration:underline;
}
.language-switch span:hover{
    color:#ffd700;
}
.player-box-container{
    max-width:450px;
    margin:50px auto 20px auto;
}
.player-description{
    font-weight:bold;
    font-size:16px;
    text-transform:uppercase;
    text-shadow:0 0 8px #ffd700;
}
.player-box{
    border:1px solid #d4af37;
    padding:20px;
    border-radius:14px;
    box-shadow:0 0 20px rgba(212,175,55,0.3);
}
.player-box.playing{
    animation:playerGlow 1s infinite alternate;
}
audio{ width:100%; }
.category{
    margin:20px auto;
    max-width:420px;
    border:1px solid #d4af37;
    padding:12px;
    border-radius:12px;
}
.track-list{ display:none; margin-top:10px; }
.track-list div{
    padding:6px;
    cursor:pointer;
    border-bottom:1px solid #333;
}
footer{
    padding:25px 15px;
    font-size:14px;
    max-width:900px;
    margin:30px auto 0;
    text-align:left;
}
.fixed-buttons{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.fixed-buttons a{
    text-decoration:none;
    padding:10px 14px;
    border-radius:6px;
    font-weight:bold;
    color:#0b0b0b;
}
.whatsapp-btn{ background:#25D366; }
.message-btn{ background:#d4af37; }

@keyframes playerGlow{
    from{box-shadow:0 0 20px rgba(212,175,55,0.5);}
    to{box-shadow:0 0 45px rgba(212,175,55,1);}
}
</style>
</head>

<body>

<header>
    <div class="language-switch">
        <span onclick="setLanguage('tr')">TR</span> | 
        <span onclick="setLanguage('en')">EN</span>
    </div>

    <h1 class="header-main-title">
        <span>Siyah Altın </span><span>P</span>rodüksiyon
    </h1>

    <div class="sk-title">S<span class="sk-line"></span>K</div>

    <h2 class="header-sub-title" id="header-sub-title">BLACK GOLD PRODUCTION</h2>
    <div class="professional-title">PROFESYONEL</div>

    <div class="sub" id="sub1">Hazır Şarkılar • Besteler</div>
    <div class="sub" id="sub2">Satışa ve Devire Hazır Eserler</div>
</header>

<script>
function setLanguage(lang){
    if(lang==="en"){
        document.querySelector(".professional-title").innerText="PROFESSIONAL";
        document.getElementById("sub1").innerText="Ready Songs • Compositions";
        document.getElementById("sub2").innerText="Available for Sale & License";
    }else{
        document.querySelector(".professional-title").innerText="PROFESYONEL";
        document.getElementById("sub1").innerText="Hazır Şarkılar • Besteler";
        document.getElementById("sub2").innerText="Satışa ve Devire Hazır Eserler";
    }
}
</script>

</body>
</html>
