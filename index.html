<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{ font-size:18px; font-weight:bold; margin:6px 0; }
.header-main-title{
    font-size:38px;font-weight:900;letter-spacing:8px;margin-bottom:5px;
    color:#ffd700;text-shadow:0 0 15px #ffd700;
}
.header-sub-title{
    font-size:28px;font-weight:700;margin-bottom:5px;
    color:#ffd700;text-shadow:0 0 8px #ffd700;
}
.professional-title{
    font-size:32px;font-weight:800;margin-bottom:15px;
    color:#ffd700;text-shadow:0 0 12px #ffd700,0 0 22px #ffd700;
}
.sk-title{
    font-size:32px;font-weight:500;color:#ffd700;
    text-shadow:0 0 4px #ffd700,0 0 8px #ffd700;
    margin:10px auto 15px auto;
    display:flex;justify-content:center;gap:6px;
}
.language-switch{position:absolute;top:15px;right:20px;font-weight:bold;}
.player-box-container{max-width:450px;margin:50px auto 20px;}
.player-description{font-weight:bold;color:#ffd700;margin-bottom:10px;}
.player-box{
    border:1px solid #d4af37;padding:20px;border-radius:14px;
    box-shadow:0 0 20px rgba(212,175,55,0.3);
}
.player-box.playing{animation:playerGlow 1s infinite alternate;}
audio{width:100%;}
.category{
    margin:20px auto;max-width:420px;border:1px solid #d4af37;
    padding:12px;border-radius:12px;
}
.category h3{cursor:pointer;display:flex;gap:6px;}
.track-list{display:none;margin-top:10px;}
.track-list div{
    padding:6px;cursor:pointer;border-bottom:1px solid #333;
    display:flex;gap:6px;
}
footer{padding:25px 15px;max-width:900px;margin:30px auto;text-align:left;}
.fixed-buttons{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;}
.whatsapp-btn{background:#25D366;padding:10px;border-radius:6px;color:#000;}
.message-btn{background:#d4af37;padding:10px;border-radius:6px;color:#000;}
@keyframes playerGlow{
    from{box-shadow:0 0 20px rgba(212,175,55,.5);}
    to{box-shadow:0 0 50px rgba(212,175,55,1);}
}
</style>
</head>

<body>

<header>
    <h1 class="header-main-title">Siyah Altın Prodüksiyon</h1>
    <div class="sk-title">SK</div>
    <h2 class="header-sub-title">BLACK GOLD PRODUCTION</h2>
    <div class="professional-title">PROFESYONEL</div>
</header>

<section>
<div class="player-box-container">
    <div class="player-description">SATIŞA VE DEVİRE HAZIR ESERLER</div>
    <div class="player-box" id="playerBox">
        <div id="nowPlaying">Seçili şarkı yok</div>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<div class="category">
<h3 onclick="toggleList('pop')">🎧 Pop</h3>
<div class="track-list" id="pop">
    <div onclick="playTrack('Korkuyorum','mp3.korkuyorum.mp3')">🎧 Korkuyorum</div>
    <div onclick="playTrack('Masal','masal.pop.mp3.mp3')">🎧 Masal</div>
</div>
</div>

</section>

<footer>
<p>📞 0507 416 36 05 | 📧 skaynar578@gmail.com | 2026</p>
</footer>

<div class="fixed-buttons">
<a class="whatsapp-btn" href="https://wa.me/905074163605">WhatsApp</a>
<a class="message-btn" href="https://wa.me/905074163605?text=Merhaba">Mesaj</a>
</div>

<script>
const player=document.getElementById("audioPlayer");
const nowPlaying=document.getElementById("nowPlaying");
const playerBox=document.getElementById("playerBox");

function playTrack(name,file){
    player.src=file;
    nowPlaying.textContent="Çalan: "+name;
    player.play();
    playerBox.classList.add("playing");
}
function toggleList(id){
    const el=document.getElementById(id);
    el.style.display=el.style.display==="block"?"none":"block";
}
</script>

</body>
</html>
