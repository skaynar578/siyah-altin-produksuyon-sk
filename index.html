<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{
    font-size:18px;
    font-weight:bold;
    margin:6px 0;
}
.header-main-title{
    font-size:38px;
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 15px #ffd700;
    max-width:90%;
    margin-left:auto;
    margin-right:auto;
}
.header-sub-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 8px #ffd700;
}
.professional-title{
    font-size:32px;
    font-weight:800;
    margin-bottom:15px;
    color:#ffd700;
    text-shadow:0 0 12px #ffd700,0 0 22px #ffd700;
}

.sk-title{
    font-size:32px; 
    font-weight:500;
    color:#ffd700;
    text-shadow:0 0 4px #ffd700, 0 0 8px #ffd700; 
    margin:10px auto 15px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px; 
}

.language-switch{
    position:absolute;
    top:15px;
    right:20px;
    font-weight:bold;
    font-size:14px;
}
.language-switch span{
    cursor:pointer;
    margin:0 5px;
    text-decoration:underline;
}

.player-box-container{
    max-width:450px;
    margin:50px auto 20px auto;
}
.player-description{
    font-weight:bold;
    font-size:16px;
    color:#ffd700;
    margin-bottom:10px;
}
.player-box{
    border:1px solid #d4af37;
    padding:20px;
    border-radius:14px;
}
#nowPlaying{ font-weight:bold; margin-bottom:10px; }
audio{ width:100%; }

.category{
    margin:20px auto;
    max-width:420px;
    border:1px solid #d4af37;
    padding:12px;
    border-radius:12px;
}
.category h3{
    cursor:pointer;
    margin:0;
    display:flex;
    align-items:center;
    gap:6px;
}
.track-list{
    display:none;
    margin-top:10px;
}
.track-list div{
    padding:6px;
    cursor:pointer;
    border-bottom:1px solid #333;
}

footer{
    padding:25px 15px;
    font-size:14px;
    max-width:900px;
    margin:30px auto 0 auto;
    text-align:left;
}
</style>
</head>

<body>

<header>
    <h1 class="header-main-title">Siyah Altın Prodüksiyon</h1>
    <h2 class="header-sub-title">BLACK GOLD PRODUCTION</h2>
</header>

<section>
    <div class="player-box-container">
        <div class="player-box">
            <div id="nowPlaying">Seçili şarkı yok</div>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <div class="category">
        <h3 onclick="toggleList('pop')">🎧 Pop</h3>
        <div class="track-list" id="pop">
            <div onclick="playTrack('Korkuyorum','mp3.korkuyorum.mp3')">🎧 Korkuyorum</div>
            <div onclick="playTrack('Masal','masal-pop-mp3.mp3')">🎧 Masal</div>
            <div onclick="playTrack('Bu Geçer','bu-gecer.mp3.mp3')">🎧 Bu Geçer</div>
            <div onclick="playTrack('Hadi Gidelim','hadi-gidelim-pop.mp3')">🎧 Hadi Gidelim</div>
        </div>
    </div>

    <!-- SADECE EKLENEN KATEGORİ -->
    <div class="category">
        <h3 onclick="toggleList('hiphop')">🎧 Yeni Nesil Hip Hop</h3>
        <div class="track-list" id="hiphop"></div>
    </div>

</section>

<script>
const player=document.getElementById("audioPlayer");
const nowPlaying=document.getElementById("nowPlaying");

function playTrack(name,file){
    player.src=file;
    nowPlaying.textContent="Çalan Şarkı: "+name;
    player.play();
}

function toggleList(id){
    const el=document.getElementById(id);
    el.style.display=el.style.display==="block"?"none":"block";
}
</script>

</body>
</html>
