<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION · SK</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
nav{ margin:15px 0; }
nav a{
    color:#d4af37;
    text-decoration:none;
    margin:0 10px;
    font-weight:bold;
}
.section-title{
    margin:0;
}
.sub{
    font-size:16px;
    font-weight:bold;
    margin:6px 0;
}
.header-main-title{
    font-size:32px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:5px;
    color:#ffd700;
    text-shadow: 0 0 15px #ffd700;
}
.header-sub-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:15px;
    color:#ffd700;
    text-shadow: 0 0 8px #ffd700;
}
.language-switch{
    position:absolute;
    top:15px;
    right:20px;
    font-weight:bold;
    font-size:14px;
}
.language-switch span{
    cursor:pointer;
    margin:0 5px;
    text-decoration:underline;
}
.language-switch span:hover{
    color:#ffd700;
}
.notice{
    margin:15px 0;
    font-size:16px;
    font-weight:bold;
    line-height:1.5;
}
.player-box{
    border:1px solid #d4af37;
    padding:20px;
    margin:20px auto;
    max-width:450px;
    border-radius:14px;
    box-shadow:0 0 20px rgba(212,175,55,0.3);
    transition:0.3s;
}
.player-box:hover{
    box-shadow:0 0 30px rgba(212,175,55,0.5);
}
#nowPlaying{
    font-weight:bold;
    margin-bottom:10px;
    transition:0.3s;
}
audio{
    width:100%;
    height:32px;
}
.category{
    margin:20px auto;
    max-width:420px;
    border:1px solid #d4af37;
    padding:12px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(212,175,55,0.1);
    transition:0.3s;
}
.category:hover{
    box-shadow:0 0 25px rgba(212,175,55,0.25);
}
.category h3{
    cursor:pointer;
    margin:0;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:bold;
}
.track-list{
    display:none;
    margin-top:10px;
    animation:fadeInList 0.4s ease-in-out;
}
.track-list div{
    padding:6px;
    cursor:pointer;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    gap:6px;
}
.track-list div:hover{
    background:#1a1a1a;
    transform:translateX(3px);
    transition:0.3s;
}
footer{
    padding:25px 15px;
    font-size:14px;
    line-height:1.6;
    max-width:900px;
    margin:30px auto 0 auto;
    text-align:left;
}
footer p{
    margin:6px 0;
}
footer .description{
    font-size:13px;
    color:#f0e68c;
}
footer .contacts{
    font-weight:bold;
}

/* SABİT WHATSAPP & MESAJ BUTONLARI */
.fixed-buttons{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:999;
}
.fixed-buttons a{
    text-decoration:none;
    padding:10px 14px;
    border-radius:6px;
    font-weight:bold;
    font-size:14px;
    color:#0b0b0b;
    transition:0.3s;
}
.fixed-buttons a:hover{
    box-shadow:0 0 15px #d4af37;
    transform:scale(1.05);
}
.whatsapp-btn{
    background:#25D366;
}
.message-btn{
    background:#d4af37;
}

/* ANİMASYONLAR */
@keyframes fadeInList{
    from{opacity:0; transform:translateY(-10px);}
    to{opacity:1; transform:translateY(0);}
}
@keyframes shakeIcon{
    0%{transform:rotate(0deg);}
    25%{transform:rotate(10deg);}
    50%{transform:rotate(-10deg);}
    75%{transform:rotate(10deg);}
    100%{transform:rotate(0);}
}
.icon-shake{
    display:inline-block;
    animation:shakeIcon 0.6s ease;
}
</style>
</head>

<body>

<header>
    <div class="language-switch">
        <span onclick="setLanguage('tr')">TR</span> | 
        <span onclick="setLanguage('en')">EN</span>
    </div>

    <h1 class="header-main-title">BLACK GOLD PRODUCTION</h1>
    <h2 class="header-sub-title" id="header-sub-title">Siyah Altın Prodüksiyon · SK</h2>

    <div class="notice" id="notice-text">
        Mağaza ve Mekan Açılışları
    </div>
    <div id="sk-text">SK</div>

    <div class="sub" id="sub1">Hazır Şarkılar • Besteler</div>
    <div class="sub" id="sub2">Satışa ve Devire Hazır İçerikler</div>

    <nav>
        <a href="#">Müzik</a>
        <a href="#">Organizasyon</a>
    </nav>
</header>

<section>

    <div class="player-box">
        <div id="nowPlaying">Seçili şarkı yok</div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- KATEGORİLER -->
    <div class="category">
        <h3 onclick="toggleList('yeniler')"><span class="icon-shake">🎧</span> <span id="cat-yeniler">Yeniler</span></h3>
        <div class="track-list" id="yeniler">
            <div onclick="playTrack('Yeniler','yeniler.mp3.mp3')"><span>🎧</span> <span id="track-yeniler">Yeniler</span></div>
        </div>
    </div>

    <div class="category">

        <div class="track-list" id="arabesk">
            <div onclick="playTrack('Küllerimden Kalktım – Arabesk','kullerimden-kalktim.mp3.mp3')"><span>🎧</span> <span id="track-arabesk">Küllerimden Kalktım – Arabesk</span></div>
        </div>
    </div>

    <div class="category">
        <h3 onclick="toggleList('arabeskpop')"><span class="icon-shake">🎧</span> <span id="cat-arabeskpop">Arabesk Pop Karışımı</span></h3>
        <div class="track-list" id="arabeskpop">
            <div onclick="playTrack('Dünya Benim Olurdu','dunya-benim-olurdu.mp3.mp3')"><span>🎧</span> <span id="track-arabeskpop">Dün
