<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GOLD PRODUCTION</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0b0b;
    color:#d4af37;
    text-align:center;
}
header{ padding:25px 15px; position:relative; }
.sub{ font-size:18px; font-weight:bold; margin:6px 0; }
.header-main-title{
    font-size:38px; font-weight:900; letter-spacing:8px;
    color:#ffd700; text-shadow:0 0 15px #ffd700;
}
.header-sub-title{ font-size:28px; font-weight:700; color:#ffd700; }
.professional-title{ font-size:32px; font-weight:800; color:#ffd700; }
.sk-title{ font-size:32px; color:#ffd700; display:flex; justify-content:center; gap:6px; }
.language-switch{ position:absolute; top:15px; right:20px; font-size:14px; }
.language-switch span{ cursor:pointer; text-decoration:underline; }

.player-box-container{ max-width:450px; margin:50px auto 20px; }
.player-box{
    border:1px solid #d4af37; padding:20px; border-radius:14px;
    box-shadow:0 0 20px rgba(212,175,55,0.3);
}
#nowPlaying{ font-weight:bold; margin-bottom:10px; }
audio{ width:100%; }

.category{
    margin:20px auto; max-width:420px;
    border:1px solid #d4af37; padding:12px; border-radius:12px;
}
.category h3{ cursor:pointer; display:flex; gap:6px; }
.track-list{ display:none; margin-top:10px; }
.track-list div{
    padding:6px; cursor:pointer; border-bottom:1px solid #333;
    display:flex; gap:6px;
}
.track-list div:hover{ background:#1a1a1a; transform:translateX(3px); }

.icon-shake{ animation:shakeIcon 0.6s; }
@keyframes shakeIcon{
    0%{transform:rotate(0)}
    25%{transform:rotate(10deg)}
    50%{transform:rotate(-10deg)}
    75%{transform:rotate(10deg)}
    100%{transform:rotate(0)}
}
</style>
</head>

<body>

<header>
    <div class="language-switch">
        <span onclick="setLanguage('tr')">TR</span> | 
        <span onclick="setLanguage('en')">EN</span>
    </div>
    <h1 class="header-main-title">Siyah Altın Prodüksiyon</h1>
    <div class="sk-title"><span>S</span><span>K</span></div>
    <div class="professional-title">PROFESYONEL</div>
</header>

<section>
<div class="player-box-container">
    <div id="nowPlaying">Seçili şarkı yok</div>
    <div class="player-box">
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<!-- 🔥 YENİ NESİL ARABESK -->
<div class="category">
    <h3 onclick="toggleList('arabesk')">
        <span class="icon-shake">🎧</span> Yeni Nesil Arabesk
    </h3>

    <div class="track-list" id="arabesk">

        <div onclick="playTrack('Küllerimden Kalktım','kullerimden-kalktim.mp3')">
            <span>🎧</span> Küllerimden Kalktım
        </div>

        <!-- ✅ BURAYA EKLENDİ -->
        <div onclick="playTrack('Küller Arasında','kuller-arasinda.mp3')">
            <span>🎧</span> Küller Arasında
        </div>

    </div>
</div>

</section>

<script>
const player=document.getElementById("audioPlayer");
const nowPlaying=document.getElementById("nowPlaying");

function playTrack(name,file){
    if(player.src.includes(file)){
        player.paused ? player.play() : player.pause();
    }else{
        player.src=file;
        nowPlaying.textContent="Çalan Şarkı: "+name;
        player.play();
    }
}

function toggleList(id){
    const el=document.getElementById(id);
    el.style.display = el.style.display==="block" ? "none" : "block";
}

function setLanguage(lang){}
</script>

</body>
</html>
