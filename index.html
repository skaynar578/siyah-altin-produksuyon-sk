<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siyah Altın Prodüksiyon · SK</title>

<style>
/* === HİÇ DOKUNULMADI === */
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(180deg,#050505,#0b0b0b);
    color:#d4af37;
    text-align:center;
}
header{ padding:30px 15px; }
section{ padding:25px 15px; }
h1,h2,h3{ margin:12px 0; }
.hero{ max-width:900px; margin:auto; animation:fadeIn 1.2s ease; }
.hero p{ font-size:16px; line-height:1.6; opacity:0.95; }
.sub{ font-size:17px; font-weight:bold; margin:8px 0; opacity:0.9; }
.player-box{
    border:1px solid #d4af37;
    padding:15px;
    margin:25px auto;
    max-width:420px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(212,175,55,0.15);
}
#nowPlaying{ font-weight:bold; margin-bottom:10px; }
audio{ width:100%; }
.category{
    margin:20px auto;
    max-width:420px;
    border:1px solid #d4af37;
    padding:12px;
    border-radius:14px;
}
.category h3{ cursor:pointer; margin:0; }
.track-list{ display:none; margin-top:10px; }
.track-list div{ padding:7px; cursor:pointer; border-bottom:1px solid #333; }
.track-list div:hover{ background:#1a1a1a; }
footer{ padding:30px 10px; font-size:14px; opacity:0.9; }
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<section>

<div class="player-box">
<div id="nowPlaying">Seçili şarkı yok</div>
<audio id="audioPlayer" controls></audio>
</div>

<div class="category">
<h3 onclick="toggleList('yeniler')">🎧 Yeniler</h3>
<div class="track-list" id="yeniler">
<div onclick="playTrack('Yeniler Mix','yeniler-mix.mp3')">Yeniler Mix</div>
</div>
</div>

<div class="category">
<h3 onclick="toggleList('pop')">🎶 Pop</h3>
<div class="track-list" id="pop">
<div onclick="playTrack('Korkuyorum','pop01.mp3')">Korkuyorum</div>
</div>
</div>

</section>

<script>
const player = document.getElementById("audioPlayer");
const nowPlaying = document.getElementById("nowPlaying");

function playTrack(name, file){
    player.src = file;
    nowPlaying.textContent = "Çalan Şarkı: " + name;
    player.play();
}
function toggleList(id){
    const el = document.getElementById(id);
    el.style.display = el.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
